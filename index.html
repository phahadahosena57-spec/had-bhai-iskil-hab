<script id="AHEAD-VIA-FINAL-FIX">
(function () {
  "use strict";

  const $ = (s) => document.querySelector(s);

  /* =========================================================
     1. LANGUAGE
     ========================================================= */

  // নতুন ভিজিটে সাইট English থাকবে।
  // পুরোনো ভার্সনের ভুল Bangla setting থাকলে একবার English করা হবে।
  if (!localStorage.getItem("av_language_user_set")) {
    localStorage.setItem("av_lang", "English");
  }

  window.countryChange = function () {
    const country = $("#country")?.value || "Bangladesh";

    const language =
      country === "Bangladesh"
        ? "Bangla"
        : (
            window.defaultLang &&
            window.defaultLang[country]
              ? window.defaultLang[country]
              : "English"
          );

    if ($("#language")) {
      $("#language").value = language;
    }

    localStorage.setItem("av_country", country);
    localStorage.setItem("av_lang", language);
    localStorage.setItem("av_language_user_set", "1");

    if (typeof applyLang === "function") {
      applyLang(language);
    }

    if (typeof syncAccount === "function") {
      syncAccount();
    }

    if (typeof renderGenerators === "function") {
      renderGenerators();
    }
  };


  window.languageChange = function () {
    const language = $("#language")?.value || "English";

    localStorage.setItem("av_lang", language);
    localStorage.setItem("av_language_user_set", "1");

    if (typeof applyLang === "function") {
      applyLang(language);
    }

    if (typeof syncAccount === "function") {
      syncAccount();
    }

    if (typeof renderGenerators === "function") {
      renderGenerators();
    }
  };


  /* =========================================================
     2. REFERRAL LINK
     ========================================================= */

  function updateReferralLink() {
    const input = $("#refLink");

    if (!input) return;

    let userId = "AHEADVIA";

    try {
      if (typeof uid === "function") {
        userId = uid();
      } else {
        userId =
          localStorage.getItem("av_uid") ||
          "AHEADVIA";
      }
    } catch (e) {}

    const referral =
      location.origin +
      location.pathname +
      "?ref=" +
      encodeURIComponent(userId);

    if (input.tagName === "INPUT") {
      input.value = referral;
    } else {
      input.textContent = referral;
    }

    input.style.display = "block";
    input.style.visibility = "visible";
    input.style.opacity = "1";
  }


  window.copyReferral = function () {
    updateReferralLink();

    const input = $("#refLink");

    if (!input) return;

    const value =
      input.value ||
      input.textContent ||
      "";

    if (!value) return;

    if (navigator.clipboard) {
      navigator.clipboard.writeText(value)
        .then(function () {
          if (typeof toast === "function") {
            toast("Referral link copied");
          }
        })
        .catch(function () {
          fallbackCopy(value);
        });
    } else {
      fallbackCopy(value);
    }
  };


  function fallbackCopy(value) {
    const textarea = document.createElement("textarea");

    textarea.value = value;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);

    textarea.focus();
    textarea.select();

    try {
      document.execCommand("copy");
    } catch (e) {}

    textarea.remove();

    if (typeof toast === "function") {
      toast("Referral link copied");
    }
  }


  /* =========================================================
     3. HELP BUTTON IMAGE
     ========================================================= */

  function fixHelpButton() {
    const button = document.querySelector(".float");

    if (!button) return;

    const headsetSVG =
      "data:image/svg+xml;charset=UTF-8," +
      encodeURIComponent(`
        <svg xmlns="http://www.w3.org/2000/svg"
             viewBox="0 0 100 100">

          <circle
            cx="50"
            cy="50"
            r="46"
            fill="white"/>

          <path
            d="M24 51
               C24 35 35 23 50 23
               C65 23 76 35 76 51
               V67
               C76 72 72 76 67 76
               H61
               V48
               H76

               M24 48
               H33
               V76
               H24
               C19 76 15 72 15 67
               V57
               C15 52 19 48 24 48

               M61 76
               C61 83 56 87 49 87
               H42"
            fill="none"
            stroke="#0878ff"
            stroke-width="6"
            stroke-linecap="round"
            stroke-linejoin="round"/>
        </svg>
      `);

    button.innerHTML = `
      <img
        src="${headsetSVG}"
        alt="Help"
        style="
          width:28px;
          height:28px;
          display:block;
          object-fit:contain;
        "
      >

      <span
        style="
          font-size:9px;
          font-weight:900;
          line-height:1;
        "
      >Help</span>
    `;

    button.onclick = function () {
      if (typeof go === "function") {
        go("contact");
      }
    };
  }


  /* =========================================================
     4. IMAGE PROMPT + CAPTION GENERATOR
     ========================================================= */

  let activeGenerator = "caption";

  const captionFields = [
    "topic",
    "platform",
    "tone",
    "length",
    "emoji",
    "audience",
    "cta"
  ];


  const generatorFields = {

    topic: {
      label: "Topic / Prompt",
      type: "textarea",
      placeholder: "Write your topic or prompt"
    },

    platform: {
      label: "Platform",
      type: "select",
      options: [
        "Facebook",
        "Instagram",
        "YouTube",
        "TikTok",
        "Telegram",
        "WhatsApp",
        "X",
        "Website"
      ]
    },

    tone: {
      label: "Tone",
      type: "select",
      options: [
        "Professional",
        "Friendly",
        "Energetic",
        "Educational",
        "Simple",
        "Funny"
      ]
    },

    length: {
      label: "Length",
      type: "select",
      options: [
        "Short",
        "Medium",
        "Long"
      ]
    },

    emoji: {
      label: "Emoji",
      type: "select",
      options: [
        "Yes",
        "No"
      ]
    },

    audience: {
      label: "Audience",
      type: "input",
      placeholder: "Example: customer, student"
    },

    cta: {
      label: "Call To Action",
      type: "input",
      placeholder: "Example: Start now"
    }
  };


  function createGeneratorField(key, index) {

    const field = generatorFields[key];

    if (!field) return "";

    const id = "gf" + index;

    if (field.type === "select") {

      return `
        <label>
          ${field.label}

          <select id="${id}">
            ${field.options
              .map(option =>
                `<option>${option}</option>`
              )
              .join("")}
          </select>
        </label>
      `;
    }

    if (field.type === "textarea") {

      return `
        <label>
          ${field.label}

          <textarea
            id="${id}"
            placeholder="${field.placeholder}"
          ></textarea>
        </label>
      `;
    }

    return `
      <label>
        ${field.label}

        <input
          id="${id}"
          type="text"
          placeholder="${field.placeholder}"
        >
      </label>
    `;
  }


  const oldOpenGenerator = window.openGen;

  window.openGen = function (id) {

    activeGenerator = id;

    /*
      IMAGE PROMPT:
      শুধু Prompt field
    */

    if (id === "imageprompt") {

      const modal = $("#modal");
      const form = $("#modal .form");

      if (!modal || !form) return;

      form.innerHTML = `
        ${createGeneratorField("topic", 0)}

        <button
          type="button"
          onclick="generateNow()"
        >
          ✨ Generate
        </button>

        <div
          class="output"
          id="gOutput"
        ></div>

        <div
          class="modalActions"
        >
          <button
            type="button"
            onclick="copyOutput()"
          >
            Copy Output
          </button>

          <button
            type="button"
            onclick="generateNow()"
          >
            Regenerate
          </button>
        </div>
      `;

      const title = $("#modalTitle");

      if (title) {
        title.textContent = "Image Prompt Generator";
      }

      modal.classList.add("show");

      setTimeout(function () {
        $("#gf0")?.focus();
      }, 50);

      return;
    }


    /*
      CAPTION:
      Topic
      Platform
      Tone
      Length
      Emoji
      Audience
      CTA
    */

    if (id === "caption") {

      const modal = $("#modal");
      const form = $("#modal .form");

      if (!modal || !form) return;

      form.innerHTML =
        captionFields
          .map((field, index) =>
            createGeneratorField(field, index)
          )
          .join("") +

        `
          <button
            type="button"
            onclick="generateNow()"
          >
            ✨ Generate
          </button>

          <div
            class="output"
            id="gOutput"
          ></div>

          <div
            class="modalActions"
          >
            <button
              type="button"
              onclick="copyOutput()"
            >
              Copy Output
            </button>

            <button
              type="button"
              onclick="generateNow()"
            >
              Regenerate
            </button>
          </div>
        `;

      const title = $("#modalTitle");

      if (title) {
        title.textContent = "Caption Generator";
      }

      modal.classList.add("show");

      setTimeout(function () {
        $("#gf0")?.focus();
      }, 50);

      return;
    }


    /*
      অন্যান্য সব generator আগের মতোই থাকবে।
    */

    if (typeof oldOpenGenerator === "function") {
      oldOpenGenerator(id);
    }
  };


  /* =========================================================
     5. GENERATE
     ========================================================= */

  const oldGenerateNow = window.generateNow;

  window.generateNow = function () {

    /* IMAGE PROMPT */

    if (activeGenerator === "imageprompt") {

      const topic =
        $("#gf0")?.value?.trim() ||
        "";

      const language =
        localStorage.getItem("av_lang") ||
        "English";

      let result = "";

      if (language === "Bangla") {

        result =
          topic +
          " — detailed image prompt, " +
          "high quality, realistic composition, " +
          "cinematic lighting, professional photography, " +
          "sharp details, realistic environment, " +
          "premium visual quality.";

      } else {

        result =
          topic +
          " — detailed image prompt, " +
          "high quality, realistic composition, " +
          "cinematic lighting, professional photography, " +
          "sharp details, realistic environment, " +
          "premium visual quality.";
      }

      const output = $("#gOutput");

      if (output) {
        output.textContent = result;
      }

      return;
    }


    /* CAPTION */

    if (activeGenerator === "caption") {

      const topic =
        $("#gf0")?.value?.trim() ||
        "Digital content";

      const platform =
        $("#gf1")?.value ||
        "Facebook";

      const tone =
        $("#gf2")?.value ||
        "Professional";

      const length =
        $("#gf3")?.value ||
        "Medium";

      const emoji =
        $("#gf4")?.value ||
        "Yes";

      const audience =
        $("#gf5")?.value?.trim() ||
        "Everyone";

      const cta =
        $("#gf6")?.value?.trim() ||
        "Share your thoughts.";

      const language =
        localStorage.getItem("av_lang") ||
        "English";

      let result;

      if (language === "Bangla") {

        result =
`✨ ${topic}

প্ল্যাটফর্ম: ${platform}
টোন: ${tone}
দৈর্ঘ্য: ${length}
অডিয়েন্স: ${audience}

${cta}`;

      } else {

        result =
`✨ ${topic}

Platform: ${platform}
Tone: ${tone}
Length: ${length}
Audience: ${audience}

${cta}`;
      }


      if (emoji === "No") {
        result = result
          .replace(/[✨🔥🚀🎯💡📌]/g, "")
          .trim();
      }


      const output = $("#gOutput");

      if (output) {
        output.textContent = result;
      }


      const oldActivity =
        Number(
          localStorage.getItem("av_activity") || 0
        );

      localStorage.setItem(
        "av_activity",
        String(oldActivity + 1)
      );

      if (typeof syncAccount === "function") {
        syncAccount();
      }

      return;
    }


    /*
      অন্য সব generator আগের generate system ব্যবহার করবে।
    */

    if (typeof oldGenerateNow === "function") {
      return oldGenerateNow();
    }
  };


  /* =========================================================
     6. SMALL UI FIXES
     ========================================================= */

  const style = document.createElement("style");

  style.textContent = `

    .refLink {
      display:flex !important;
      align-items:center !important;
      gap:7px !important;
      width:100% !important;
      visibility:visible !important;
      opacity:1 !important;
    }

    .refLink input {
      display:block !important;
      visibility:visible !important;
      opacity:1 !important;
      flex:1 !important;
      min-width:0 !important;
      width:100% !important;
      color:#0878ff !important;
      background:#f0f6ff !important;
      border:0 !important;
      outline:none !important;
      font-size:9px !important;
      font-weight:800 !important;
    }

    .refLink button {
      display:block !important;
      background:#0878ff !important;
      color:#fff !important;
      border:0 !important;
      border-radius:8px !important;
      padding:8px 10px !important;
      font-weight:900 !important;
      cursor:pointer !important;
    }

    .float img {
      width:28px !important;
      height:28px !important;
      display:block !important;
      object-fit:contain !important;
    }

    .float span {
      font-size:9px !important;
      font-weight:900 !important;
    }

    .form label {
      display:block !important;
      margin:8px 0 !important;
      font-size:10px !important;
      font-weight:800 !important;
    }

    .form input,
    .form textarea,
    .form select {
      width:100% !important;
      margin-top:5px !important;
      padding:10px !important;
      border-radius:10px !important;
      box-sizing:border-box !important;
    }

    .form textarea {
      min-height:95px !important;
      resize:vertical !important;
    }

    .output {
      white-space:pre-wrap !important;
      line-height:1.7 !important;
      margin-top:10px !important;
      padding:12px !important;
      min-height:80px !important;
    }

  `;

  document.head.appendChild(style);


  /* =========================================================
     7. RUN FIXES
     ========================================================= */

  function runAllFixes() {

    fixHelpButton();
    updateReferralLink();

    /*
      Team-এর বর্তমান 3-image system-কে স্পর্শ করছি না,
      যাতে আগে ঠিক করা তিনটি আলাদা ছবি নষ্ট না হয়।
    */

    if (typeof syncAccount === "function") {
      try {
        syncAccount();
      } catch (e) {}
    }

    updateReferralLink();
    fixHelpButton();
  }


  document.addEventListener(
    "DOMContentLoaded",
    runAllFixes
  );

  setTimeout(
    runAllFixes,
    300
  );

  setTimeout(
    runAllFixes,
    1000
  );

  setTimeout(
    runAllFixes,
    2000
  );

})();
</script>
