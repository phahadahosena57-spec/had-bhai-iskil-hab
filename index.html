/* ---------- TOOLS ---------- */

function showTools(){
  currentPage="tools";
  setNav("navTools");

  $("content").innerHTML=`
    <div class="section-head">
      <h2>🤖 AI & Generators</h2>
      <span>${generators.length}+ tools</span>
    </div>

    <input id="toolSearch" class="search"
      placeholder="🔎 Search generators..."
      oninput="filterTools()">

    <div id="toolGrid" class="grid">
      ${generators.map(toolCard).join("")}
    </div>
  `;
}

function toolCard(t){
  return `<div class="card tool-card" data-name="${escapeHtml((t.name+" "+t.category).toLowerCase())}">
    <div class="ico">⚡</div>
    <h3>${escapeHtml(t.name)}</h3>
    <p>${escapeHtml(t.category)}</p>
    <button onclick="openTool(${t.id})">Open Generator</button>
  </div>`;
}

function filterTools(){
  const q=$("toolSearch").value.toLowerCase();
  document.querySelectorAll(".tool-card").forEach(c=>{
    c.style.display=c.dataset.name.includes(q)?"block":"none";
  });
}

function openTool(id){
  currentTool=generators.find(x=>x.id===id);
  if(!currentTool)return;

  $("toolTitle").textContent=currentTool.name;
  $("toolCategory").textContent=currentTool.category;
  $("toolTopic").value="";
  $("toolAudience").value="";
  $("toolExtra").value="";
  $("toolResult").textContent="Your generated result will appear here.";
  $("toolModal").classList.add("show");
}

function closeTool(){
  $("toolModal").classList.remove("show");
  currentTool=null;
}

function runGenerator(){
  if(!currentTool)return;

  const topic=$("toolTopic").value.trim()||"your chosen topic";
  const audience=$("toolAudience").value.trim()||"your target audience";
  const tone=$("toolTone").value;
  const extra=$("toolExtra").value.trim();

  let result="";

  if(currentTool.name.toLowerCase().includes("image prompt") ||
     currentTool.name.toLowerCase().includes("poster prompt") ||
     currentTool.name.toLowerCase().includes("thumbnail prompt") ||
     currentTool.name.toLowerCase().includes("logo prompt") ||
     currentTool.name.toLowerCase().includes("banner prompt") ||
     currentTool.name.toLowerCase().includes("design prompt") ||
     currentTool.name.toLowerCase().includes("cinematic prompt") ||
     currentTool.name.toLowerCase().includes("realistic photo prompt") ||
     currentTool.name.toLowerCase().includes("3d design prompt") ||
     currentTool.name.toLowerCase().includes("anime prompt") ||
     currentTool.name.toLowerCase().includes("background prompt") ||
     currentTool.name.toLowerCase().includes("ad creative prompt") ||
     currentTool.name.toLowerCase().includes("infographic prompt")){
    result=`Create a high-quality ${currentTool.name.replace(/Prompt/i,"").trim()} about "${topic}". 
Target audience: ${audience}.
Style: ${tone}.
Composition: professional, clean, detailed, visually attractive, strong focal point, balanced lighting, high detail, suitable for social media.
${extra?`Additional instruction: ${extra}`:"Use a polished modern design with readable visual hierarchy."}`;
  }else if(currentTool.name.toLowerCase().includes("hashtag")){
    result=`#${slug(topic)} #AHEADVIA #SkillHub #DigitalSkills #ContentCreator #AItools #CreatorTips #OnlineSkills #${slug(audience)}`;
  }else if(currentTool.name.toLowerCase().includes("title") ||
          currentTool.name.toLowerCase().includes("headline") ||
          currentTool.name.toLowerCase().includes("hook")){
    result=`${topic}: The Simple Guide Everyone Should Know\n\n${topic} Made Easy: Start Here\n\n7 Powerful Ideas About ${topic}\n\nStop Scrolling — Learn ${topic} Today`;
  }else if(currentTool.name.toLowerCase().includes("bio")){
    result=`${topic} | ${audience}\n🚀 Digital creator & learner\n💡 Sharing useful ideas, tools & resources\n✨ ${tone} content\n🔗 AHEAD VIA SKILL HUB`;
  }else{
    result=`${currentTool.name} — Generated Draft\n\nTopic: ${topic}\nAudience: ${audience}\nTone: ${tone}\n\nHere is a practical ${currentTool.name.toLowerCase()} for "${topic}". Create clear, useful and engaging content that gives the audience immediate value. Start with a strong opening, explain the main idea simply, add useful examples, and finish with a clear call to action.\n\nCTA: Follow AHEAD VIA SKILL HUB for more useful tools and digital resources.\n${extra?`\nExtra instruction: ${extra}`:""}`;
  }

  $("toolResult").textContent=result;
}

function copyResult(){
  const text=$("toolResult").textContent;
  navigator.clipboard?.writeText(text).then(
    ()=>toast("✅ Copied"),
    ()=>toast("Copy failed")
  );
}

function clearResult(){
  $("toolResult").textContent="";
}

/* ---------- SETTINGS ---------- */

function initSettings(){
  const countries=Object.keys(COUNTRY_LANG);
  $("country").innerHTML=countries.map(c=>`<option>${c}</option>`).join("");
  $("country").value=load("country","Bangladesh");
  countryChanged(false);

  $("usernameInput").value=load("username","Guest User");

  if(load("dark",false))document.body.classList.add("dark");
}

function countryChanged(saveIt=true){
  const c=$("country").value;
  const langs=COUNTRY_LANG[c]||["English"];

  $("language").innerHTML=langs.map(l=>`<option>${l}</option>`).join("");
  $("language").value=load("language",langs[0]);

  if(!langs.includes($("language").value)){
    $("language").value=langs[0];
  }

  if(saveIt)save("country",c);
}

function changeLanguage(){
  save("language",$("language").value);
  toast("🌍 Language saved: "+$("language").value);

  /*
    English + Bangla UI dictionary can be expanded here.
    Generator content remains user-generated/local template content.
  */
  if($("language").value==="বাংলা"){
    document.documentElement.lang="bn";
  }else{
    document.documentElement.lang="en";
  }
}

function openSettings(){
  $("drawer").classList.add("show");
  initSettings();
}
function closeDrawer(){
  $("drawer").classList.remove("show");
}

function saveProfile(){
  const name=$("usernameInput").value.trim()||"Guest User";

  closeDrawer();

}

function toggleDark(){
  document.body.classList.toggle("dark");
  save("dark",document.body.classList.contains("dark"));

function logout(){

    localStorage.removeItem("avsh_verified");

    $("app").classList.add("hidden");
    $("verifyScreen").classList.remove("hidden");
    buildJoinScreen();
  }
}

/* ---------- HELPERS ---------- */

function slug(s){
  return s.toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,18)||"topic";
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[m]));
}

function toast(msg){
  $("toast").textContent=msg;
  $("toast").style.display="block";
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>$("toast").style.display="none",1800);
}
