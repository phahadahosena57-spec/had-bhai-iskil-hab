<section id="referral">

  <div class="wrap">

    <div class="title">

      <div>

          </p>

          id="refLink"
          readonly
          value="Generating..."
        >

          class="btn"
          onclick="copyReferral()"
        >

        </button>

        </b>

      </div>

  </div>

</section>


<script>

/* =========================================
   AHEAD VIA REFERRAL SYSTEM
   ========================================= */

function referralUrl(){

  const id =
    localStorage.getItem("avuid")
    || "AV-000000";

  return (
    location.origin +
    location.pathname +
    "?ref=" +
    encodeURIComponent(id)
  );

}


function initReferral(){

  const link = referralUrl();

  const input =
    document.querySelector("#refLink");

  if(input){

    input.value = link;

  }


  /*
    যদি অন্য কারো Referral Link দিয়ে
    কেউ ওয়েবসাইটে আসে
  */

  const ref =
    new URLSearchParams(
      location.search
    ).get("ref");


  const myId =
    localStorage.getItem("avuid")
    || "";


  if(
    ref &&
    ref !== myId
  ){

    const key =
      "av_ref_seen_" +
      ref;


    if(
      !localStorage.getItem(key)
    ){

      localStorage.setItem(
        key,
        "1"
      );

      localStorage.setItem(
        "av_referrer",
        ref
      );

    }

  }


  /*
    এই ব্রাউজারে পাওয়া referral
  */

  const count =
    Object.keys(localStorage)
      .filter(
        key =>
          key.startsWith(
            "av_ref_seen_"
          )
      )
      .length;


  const countBox =
    document.querySelector(
      "#refCount"
    );


  if(countBox){

    countBox.textContent =
      count;

  }

}


/* =========================================
   COPY REFERRAL LINK
   ========================================= */

function copyReferral(){

  const input =
    document.querySelector(
      "#refLink"
    );


  const value =
    input?.value ||
    referralUrl();


  if(
    navigator.clipboard &&
    navigator.clipboard.writeText
  ){

    navigator.clipboard
      .writeText(value)
      .then(() => {

        if(typeof toast === "function"){

          toast(
            "Referral link copied!"
          );

        }

      });

  }else{

    if(input){

      input.select();

      document.execCommand(
        "copy"
      );

    }

    if(typeof toast === "function"){

      toast(
        "Referral link copied!"
      );

    }

  }

}


/* =========================================
   SHARE
   ========================================= */

function shareReferral(){

  const url =
    referralUrl();


  if(
    navigator.share
  ){

    navigator.share({

      title:
        "AHEAD VIA SKILL HUB",

      text:
        "Join AHEAD VIA SKILL HUB 🚀",

      url:url

    });

  }else{

    copyReferral();

  }

}


/* =========================================
   TELEGRAM SHARE
   ========================================= */

function shareTelegram(){

  const url =
    encodeURIComponent(
      referralUrl()
    );


  const text =
    encodeURIComponent(
      "Join AHEAD VIA SKILL HUB 🚀"
    );


  window.open(
    "https://t.me/share/url?url=" +
    url +
    "&text=" +
    text,

    "_blank"
  );

}


/* =========================================
   WHATSAPP SHARE
   ========================================= */

function shareWhatsApp(){

  const message =
    encodeURIComponent(
      "Join AHEAD VIA SKILL HUB 🚀\n\n" +
      referralUrl()
    );


  window.open(
    "https://wa.me/?text=" +
    message,

    "_blank"
  );

}


/* =========================================
   START REFERRAL
   ========================================= */

setTimeout(
  initReferral,
  100
);

</script>

<!-- =========================
     PREMIUM MENU UPDATE
     ========================= -->

<script>

(function(){

  const drawer =
    document.querySelector(
      "#drawer"
    );


  if(!drawer) return;


  /*
    পুরোনো Menu-এর linkগুলোকে
    নতুন সুন্দর Grid Menu-তে
    সাজানো
  */

  const profile =
    drawer.querySelector(
      ".menuProfile"
    );


  if(!profile) return;


  const links =
    drawer.querySelectorAll(
      ".mLink"
    );


  /*
    আগে থেকেই নতুন Menu থাকলে
    আবার তৈরি করবে না
  */

  if(
    drawer.querySelector(
      ".menuGrid"
    )
  ){

    return;

  }


  const grid =
    document.createElement(
      "div"
    );


  grid.className =
    "menuGrid";


  const menuItems = [

    [
      "🏠 Home",
      "home"
    ],

    [
      "📚 Tutorials",
      "tutorial"
    ],

    [
      "🎁 15 Days Offer",
      "offer"
    ],

    [
      "👥 Our Team",
      "team"
    ],

    [
      "👤 My Account",
      "account"
    ],

    [
      "🔗 Referral",
      "referral"
    ],

    [
      "ℹ️ About Me",
      "about"
    ],

    [
      "🆘 Help Center",
      "contact"
    ]

  ];


  menuItems.forEach(
    item => {

      const button =
        document.createElement(
          "button"
        );


      button.className =
        "mLink";


      button.innerHTML =
        item[0] +
        ' <span>›</span>';


      button.onclick =
        function(){

          if(
            typeof goM === "function"
          ){

            goM(
              item[1]
            );

          }else{

            drawer.classList.remove(
              "open"
            );

            document
              .getElementById(
                item[1]
              )
              ?.scrollIntoView({
                behavior:"smooth"
              });

          }

        };


      grid.appendChild(
        button
      );

    }
  );


  /*
    পুরোনো Menu link বাদ
  */

  links.forEach(
    link =>
      link.remove()
  );


  /*
    Profile-এর নিচে নতুন Menu
  */

  profile.after(
    grid
  );

})();

</script>
