<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ahad Bhai Skill Lab — Admin</title><link rel="stylesheet" href="style.css"></head><body><main class="section" style="display:block;padding-bottom:40px"><div class="card"><p class="eyebrow">PRIVATE ADMIN</p><h1>Ahad Bhai Skill Lab Admin Panel</h1><p>Edit website content and save it live to Supabase.</p><div id="loginBox"><label>Admin Email<input id="email" type="email"></label><label>Password<input id="pass" type="password"></label><button class="primary" onclick="login()">Login</button></div><div id="panel" style="display:none"><label>About Me<textarea id="about" rows="3"></textarea></label><label>Telegram Channel<input id="channel"></label><h2>Tutorials</h2><textarea id="tutorials" rows="12" placeholder="One tutorial per line: Title | Description"></textarea><h2>Social Links</h2><textarea id="social" rows="10" placeholder="Name | URL | Icon"></textarea><button class="primary" onclick="save()">Save All Changes</button> <button class="ghost" onclick="load()">Refresh</button> <button class="danger" onclick="logout()">Logout</button><p id="status"></p></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://bkxpeycpqphskjpgimsj.supabase.co','sb_publishable_v9KFnlmn-BJsZrs2CDLrsw_NUCAkVZy');const D={about:'I teach everything online.',channel:'https://t.me/+VeysP6zpQI9kZTJl',tutorials:[['AI Video Creation','AI video creation and practical tools'],['Thumbnail Design','Create attractive thumbnails'],['Hashtags','Learn how to use hashtags'],['Captions','Write better captions'],['Location','Use location on Facebook and YouTube'],['Video Creation','Create videos step by step'],['Facebook','Learn Facebook content skills'],['YouTube','Learn YouTube content skills'],['Video Promotion','Promote videos effectively']],social:[['Telegram Personal','https://t.me/Aheadvia1298','✈️'],['Telegram Channel','https://t.me/+VeysP6zpQI9kZTJl','📢'],['Telegram Group','https://t.me/+po7cNT2DyokwMzQ1','👥'],['Facebook','https://www.facebook.com/share/199T5uSBXv/','f'],['Instagram','https://www.instagram.com/kittysnipsofficial?stkn=MW44cGFpYWNkc3F5bQ==','◎'],['YouTube','https://www.youtube.com/@KittySnipsStories','▶'],['TikTok','https://www.tiktok.com/@abdulahead121','♪'],['X','https://x.com/Abdulaheadrllm','𝕏']]};async function login(){const e=document.getElementById('email').value,p=document.getElementById('pass').value;const r=await sb.auth.signInWithPassword({email:e,password:p});if(r.error)return alert(r.error.message);document.getElementById('loginBox').style.display='none';document.getElementById('panel').style.display='block';load()}async function load(){const r=await sb.from('site_settings').select('data').eq('id','main').maybeSingle();const x=r.data?.data||D;document.getElementById('about').value=x.about||D.about;document.getElementById('channel').value=x.channel||D.channel;document.getElementById('tutorials').value=(x.tutorials||D.tutorials).map(a=>a.join(' | ')).join('\n');document.getElementById('social').value=(x.social||D.social).map(a=>a.join(' | ')).join('\n')}async function save(){const tutorials=document.getElementById('tutorials').value.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(x=>x[0]).map(x=>[x[0],x[1]||'']);const social=document.getElementById('social').value.split('\n').map(x=>x.split('|').map(y=>y.trim())).filter(x=>x[0]&&x[1]).map(x=>[x[0],x[1],x[2]||'🔗']);const data={about:document.getElementById('about').value.trim(),channel:document.getElementById('channel').value.trim(),tutorials,social};const r=await sb.from('site_settings').upsert({id:'main',data,updated_at:new Date().toISOString()},{onConflict:'id'});document.getElementById('status').textContent=r.error?'Error: '+r.error.message:'Saved live successfully.'}async function logout(){await sb.auth.signOut();location.reload()}</script></body></html>
